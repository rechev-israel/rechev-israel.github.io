# Rebuilds the per-car pages (car/<id>/) and sitemap.xml whenever the inventory changes.
name: Car pages

on:
  push:
    branches: [main]
    paths: [cars.json, tools/build_car_pages.py, .github/workflows/car-pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_car_pages.py
      - name: Commit changes
        run: |
          git add -A car sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "עדכון עמודי רכבים"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
